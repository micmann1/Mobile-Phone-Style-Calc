    <script>

"use strict";

class CalcDisplay {
    //Right-aligned text that keeps the cursor at the
    // right edge when inputting text, but the user may
    // use the pointer or arrow/home/end keys to navigate
    // around and view or edit any of the text.
    //Font size starts at largest size and when the
    // current text won't fit the width of the display,
    // the font decreases in size, as needed to try to fit
    // all chars into the display, until the smallest
    // specified font size is used. If even MORE text is
    // then added, the leading characters will begin to
    // move out of view past the left edge.
    constructor(el) {
        this.atomicRx = null;
        this.bgcolor = el.style.backgroundColor || 'white';
        this.cbfunc = ()=>{;};
        this.color = "black";
        this.ctx = el.getContext("2d");
        this.cursorOn = false;
        this.el = el;
        this.fontDefault = 44;
        this.fontSizeMax = 44;
        this.fontSizeMin = 44;
        this.fontSizeNow = 44;
        this.fontAttrib = '';
        this.fontUnits = '';
        this.fontName = '';
        this.grouping = true;//user can adjust to false
        this.groupchar = this.groupChar();
        this.keyStack = {"ArrowRight":0, "ArrowLeft":0, "Backspace":0, "Escape":0,
            "Delete":0, "Home":0, "End":0};
        this.metrics = el.getBoundingClientRect();
        this.ptrInfo = {"down":false/*other attrs may be added in future*/};
        this.selectcolor = "rgba(0,40,255,0.15)";
        this.selection = [0, 0];
        this.showCursor = false;
        this.text = '';
        //Temp is simply this.text that is copied to this.temp
        // by calling the function setTemp(). It will be copied
        // BACK to this.text and displayed if the "Backspace" key is
        // the very NEXT edit that is made(with no selection range).
        this.temp = '';
        this.timerCursor = null;
        this.translateX = 0;

        this.H = (this.el.height || this.metrics.height);//px
        this.W = (this.el.width || this.metrics.width);//px
        this.MAXCHARS = 120;//modify as needed

        this.el.addEventListener("pointerdown", (evt) => { this.interactEvent(evt) });
        this.el.addEventListener("pointermove", (evt) => { this.interactEvent(evt) });
        this.el.addEventListener("pointerup", (evt) => { this.interactEvent(evt) });
        this.el.addEventListener("pointerout", (evt) => { this.interactEvent(evt) });

        this._cursorBlink();
    }
    addText(txt, docallback = true) {
        const minsel = Math.min(...this.selection);
        const maxsel = Math.max(...this.selection);

        if (this.text.length - (maxsel - minsel) + txt.length > this.MAXCHARS)
            throw new Error("text string over maximum size");

        const remains    = this.text.length - maxsel;

        this.text = this.text.slice(0, minsel) + txt + this.text.slice(maxsel);
        if(this.grouping) this.text = this._grouped(this.text);

        this.selection = [this.text.length-remains, this.text.length-remains];

        this._updateDisplay();

        if(docallback)
            this.temp = '', this.cbfunc([null, this.degrouped()]);
    }
    backspace() {
        if (this._isEmptyRange()) {
            if(this.temp.length){
                this.text = this.temp;
                return this.moveEnd(false);
            }
            const atom = this._atomicArea(this._sc(this.selection[1]-1));
            const lowc = atom===null?this._sc(this.selection[1]-1):atom[0];
            this.text = this.text.slice(0, lowc) + this.text.slice(this.selection[1]);
            this.selection = [lowc, lowc];
        }
        else
            this._removeSelection();
        if(this.grouping) this.text = this._grouped();
        this._updateDisplay();this._cursorBlink();
    }
    clear(docallback = true) {
        this.text = '';
        this.selection = [0, 0];
        this.translateX = 0;
        this._updateDisplay();
        if(docallback)
            this.cbfunc([null, this.degrouped()]);
    }
    degrouped(txt){
        return (txt || this.text).replaceAll(this.groupchar, '');
    }
    doDelete() {
        if (this._isEmptyRange()){
            const atom = this._atomicArea(this._sc(this.selection[1]+1));
            const highc = atom===null?this._sc(this.selection[1]+1):atom[1];
            this.text = this.text.slice(0, this.selection[1])  + this.text.slice(highc);
        }
        else
            this._removeSelection();
        if(this.grouping) this.text = this._grouped();
        this._updateDisplay();this._cursorBlink();
    }
    escape() {
        this.selection = [this.selection[1], this.selection[1]];
        this._updateDisplay();this._cursorBlink();
    }
    getSelectedText() {
        return this.text.slice(this.selection[0], this.selection[1]);
    }
    getSelection() {
        return this.selection.slice(0);
    }
    getText(){
        return this.text;
    }
    groupChar(){
        const c = (1000).toLocaleString().slice(-4,-3);
        return c=='1'?'':c;
    }
    interactEvent(evt) {
        if (evt.type.startsWith("pointer")) {
            this.pointerAction(evt);
            evt.preventDefault();
            return false;
        }
        //keydown must be sent by the user from outer context
        // for processing digits and decimal separators, and the
        // Enter key, since canvas has no ability to hold focus
        // for general keyboard events.

        const [key, typ, isShift] = [evt.key, evt.type, evt.shiftKey];
        if (typ == "keyup") {
            return this.keyStack[key] = 0;
        }
        if (key == "Backspace"){
            if(this._millis() - this.keyStack[key] > 50){
                this.backspace();
                this.keyStack[key] = this._millis();
            }
            this.temp = '';
        }
        else if (key == "Delete"){
            if(this._millis() - this.keyStack[key] > 50){
                this.doDelete();
                this.keyStack[key] = this._millis();
            }
            this.temp = '';
        }
        else if (key.startsWith("Arrow")){
            if(this._millis() - this.keyStack[key] > 33){
                this.moveCursor1(key == "ArrowLeft" ? -1 : 1, isShift);
                this.keyStack[key] = this._millis();
            }
        }
        else if (key == "Escape")
            this.escape();
        else if (key == "Home")
            this.moveHome(isShift);
        else if (key == "End")
            this.moveEnd(isShift);
        this.cbfunc([evt, this.degrouped()]);
        evt.preventDefault();
        return false;
    }
    moveCursor1(dir/*1 or -1*/, isShift) {
        const _as = this._atomSkip.bind(this);
        //TODO
        if(!this._isEmptyRange() && !isShift)
            this.selection = [this.selection[1], this.selection[1]];
        else if(isShift)
            this.selection = [this.selection[0], _as(this._sc(this.selection[1] + dir), dir)];
        else
            this.selection = [_as(this._sc(this.selection[1] + dir), dir),
                                _as(this._sc(this.selection[1] + dir), dir)];

        this._updateDisplay();this._cursorBlink();
    }
    moveEnd(isShift) {
        this.selection = [isShift?this.selection[0]:this.text.length, this.text.length];
        this._updateDisplay();this._cursorBlink();
    }
    moveHome(isShift) {
        this.selection = [isShift?this.selection[0]:0, 0];
        this._updateDisplay();this._cursorBlink();
    }
    pointerAction(evt){
        const _as = this._atomSkip.bind(this);
        if (evt.type == "pointerdown") {
            this.ptrInfo["down"] = true;
            this.ptrInfo["startX"] = evt.offsetX;
            this.ptrInfo["time"] = this._millis();
            const pointerCursor = this._calcCursorFromOffsetX(evt.offsetX);
            if(evt.shiftKey)
                this.selection[1] = _as(pointerCursor,
                    this.selection[0]<this.selection[1]?1:-1);
            else
                this.selection = [_as(pointerCursor,0), _as(pointerCursor,0)];
            this._updateDisplay();this._cursorBlink();
        }
        else if (evt.type == "pointerup" || evt.type == "pointerout") {
            this.ptrInfo["down"] = false;
            this._updateDisplay();
        }
        else if (this.ptrInfo["down"] && evt.type == "pointermove"){
                this.translateX += evt.movementX;
                this.cbfunc([evt, this.degrouped()]);
                this._updateDisplay();this._cursorBlink();
        }
    }
    repaint(){this._updateDisplay();this._cursorBlink()}
    setAtomics(atom){
        //*atom* is an array(or array-like obj), that contains strings that are
        // to be considered 'one atomic/discrete unit' in terms of selection/deletion.
        const repfunc = (t)=>{return String.fromCodePoint(92)/*Backslash*/ + t};
        let cpAtom = atom.slice(0);
        cpAtom.sort((a,b)=>{return b.length-a.length});
        cpAtom = cpAtom.map((t)=>{return t.replace(/[(|){}\[\]\*\+\?\^\$]/g, repfunc)});
        const atomicText = '(' + cpAtom.join('|') + '|.)';
        this.atomicRx = new RegExp(atomicText);
    }
    setCallback(cbfunc){this.cbfunc = cbfunc}
    setColor(color, bgcolor, selectcolor){
        this.color = color;
        this.bgcolor = bgcolor;
        this.selectcolor = selectcolor;
        this.ctx.fillStyle = this.color;
        this.repaint();
    }
    setCursor(seton){this.showCursor = seton; this.repaint()}
    setFontProperties(fontobj) {
        //fontobj has properties: attrib, sizeMin, sizeMax, units, name
        //fontobj.sizeMax is intended to be the starting/default size.
        if (!isFinite(fontobj.sizeMin) || !isFinite(fontobj.sizeMax)) throw new Error("invalid font size size");
        if (!fontobj.units.length) throw new Error('missing font units');
        if (!fontobj.name.length) throw new Error('missing font name');
        this.fontAttrib = fontobj.attrib;
        this.fontSizeMax = fontobj.sizeMax;
        this.fontSizeNow = fontobj.sizeMax;
        this.fontSizeMin = fontobj.sizeMin;
        this.fontUnits = fontobj.units;
        this.fontName = fontobj.name;
        this.fontDefault = `${fontobj.attrib} ${fontobj.numberMax}${fontobj.units} ${fontobj.name}`.trim();
        this.ctx.font = this.fontDefault;
        this.ctx.textAlign = "right";
        this.ctx.textBaseline = "alphabetic";
    }
    setTemp(txt){this.temp = this.text; this.text = txt; this.cbfunc(["setTemp", this.degrouped()])}
    setText(txt, docallback = true){
        this.clear(docallback), this.addText(txt, docallback);
    }

    _atomicArea(cursor){
        //If *cursor* is inside a atomic area, returns the
        // begin and end cursor locations for that area, else null.
        if(this.atomicRx===null) return null;
        for(let i=0; i<Math.min(cursor, this.text.length);){
            const txt = this.text.slice(i);
            const fnd =txt.match(this.atomicRx);
            if(fnd[1].length>1 && i<cursor && cursor<i+fnd[1].length)
                return [i, i+fnd[1].length];
            i += fnd[1].length;
        }
        return null;
    }
    _atomSkip(cursor, dir = 0/*or -1 or 1*/){
        const atom = this._atomicArea(cursor);
        if(atom===null) return cursor;
        if(dir==0){
            return Math.abs(cursor-atom[0])<Math.abs(cursor-atom[1])?
                atom[0]:atom[1];
        }
        return dir==-1?atom[0]:atom[1];
    }
    _calcCursorFromOffsetX(offsetX) {
        let _tw = this._textWidth.bind(this);
        const trueLeft = (this.W - offsetX) + this.translateX;
        let [lowc, highc, midc, w] = [0, this.text.length, 0];
        while(lowc <= highc) {
            midc = lowc + Math.trunc((highc - lowc) / 2);
            w    = _tw(this.text.substr(midc));
            if(Math.abs(w - trueLeft) < 1)
                return midc;
            else if(w > trueLeft)
                lowc = midc + 1;
            else
                highc = midc - 1;
        }
        return  Math.abs(trueLeft-_tw(this.text.substr(lowc ))) <
                Math.abs(trueLeft-_tw(this.text.substr(highc))) ? lowc : highc;
    }
    _calcOffsetXFromSelect(select1) {
        return this.W - this._textWidth(this.text.substr(select1));
    }
    _cursorBlink(arg) {
        ////when called by another class member, cursor will
        //// IMMEDIATELY begin it's blink cycle as VISIBLE(ON).
        clearTimeout(this.timerCursor);
        const hasarg = typeof (arg) != "undefined";
        this.cursorOn = (hasarg ? !this.cursorOn : true);
        if(!this.cursorOn)
            this._updateDisplay();
        else if(this.showCursor){
            let x = this._calcOffsetXFromSelect(this.selection[1]);
            if ((this.W - x) <= 1) x = this.W - 2;/*for ease of viewing*/
            this.ctx.save();
            this.ctx.beginPath();
            this.ctx.moveTo(x, this.H - this.fontSizeNow);
            this.ctx.lineTo(x, this.H);
            this.ctx.lineWidth = '2';
            this.ctx.strokeStyle = this.ctx.fillStyle;
            this.ctx.stroke();
            this.ctx.closePath();
            this.ctx.restore();
        }
        if(this.showCursor)
            this.timerCursor = setTimeout(() => { this._cursorBlink(1) }, 530);
    }
    _drawRangeBackground() {
        this.ctx.save();
        if (this.selection[0] == this.selection[1]) return;
        this.ctx.fillStyle = this.selectcolor;
        const x0 = this._calcOffsetXFromSelect(this.selection[0]);
        const x1 = this._calcOffsetXFromSelect(this.selection[1]);
        this.ctx.fillRect(Math.min(x0,x1), 0, Math.abs(x1 - x0), this.H);
        this.ctx.restore();
    }
    _fsw(){return this.fontSizeNow/4};//small window based on current font size
    _grouped(){
        let rtn = '';
        let str = this.degrouped();
        for (const m of String(str).matchAll(/(\.\d+|\.|[^\d\.]+|\d+)/g)) {
            if (!/^\d/.test(m[1]))
                rtn += m[1];
            else
                rtn += '' + Number(m[1]).toLocaleString();
        }
        return rtn;
    }
    _isEmptyRange() {
        return (this.selection[0] == this.selection[1]);
    }
    _millis(){return new Date().getTime()}
    _modFontSz(sz) {
        return `${this.fontAttrib} ${sz}${this.fontUnits} ${this.fontName}`.trim();
    }
    _removeSelection() {
        this.text = this.text.substr(0, Math.min(...this.selection)) + this.text.substr(Math.max(...this.selection));
        if (this.selection[1] < this.selection[0])
            this.selection[0] = this.selection[1];
        else
            this.selection[1] = this.selection[0];
    }
    _sc(val){//selection clamp
        return val<0 ? 0 : val>this.text.length ? this.text.length : val;
    }
    _setTransform() {
        if(this._textWidth(this.text) > this.W){
            const ox = this._calcOffsetXFromSelect(this.selection[1]) + this.translateX;
            if (ox > this.W - this._fsw())
                this.translateX -= ox - (this.W - this._fsw());
            else if (ox < this._fsw() + 2)
                this.translateX += (this._fsw() + 2) - ox;
            this.translateX = Math.max(0, this.translateX);//nothing less than zero!
            this.ctx.setTransform(1, 0, 0, 1, this.translateX, 0);
        }
        else{
            this.translateX = 0;
            this.ctx.setTransform(1, 0, 0, 1, 0, 0);
        }
    }
    _textWidth(txt, fnt = null) {
        this.ctx.save();
        this.ctx.font = fnt===null ? this._modFontSz(this.fontSizeNow) : fnt;
        const wid = this.ctx.measureText(txt).width;
        this.ctx.restore();
        return wid;
    }
    _updateDisplay() {
        this.ctx.clearRect(-1 * this.MAXCHARS * this.fontSizeMax, 0,
            2 * this.MAXCHARS * this.fontSizeMax, this.H
        );
        this._setTransform();
        this._drawRangeBackground();
        const USEWID = this.W - this._fsw();
        const wid = this._textWidth(this.text, this._modFontSz(this.fontSizeMax));
        let sz;
        if (wid >= USEWID)
            sz = Math.max(this.fontSizeMin, this.fontSizeMax * USEWID / wid);
        else if (wid < USEWID)
            sz = Math.min(this.fontSizeMax, this.fontSizeMax * USEWID / wid);
        this.ctx.font = this._modFontSz(sz);
        this.fontSizeNow = sz;
        this.ctx.fillText(this.text, this.W, this.H - this.fontSizeNow/4/*descenders room*/);
    }
}

    <script>

"use strict";

class History {
    #MPSC_HISTORY_ID = 'MPSC_HISTORY0203';
    #MAX_HISTORY = 100;
    constructor() {
        this.tmpHistory = [];
        this.hasLocStorage = false;
        try {
            const stor = window.localStorage.getItem(this.#MPSC_HISTORY_ID);
            window.localStorage.setItem(this.#MPSC_HISTORY_ID, stor);
            this.hasLocStorage = true;
        }
        catch (ex) {
            console.log("local storage not available");
        }
    }
    add2History(v) {
        if (this.hasLocStorage) {
            let tmp = this.getHistory();
            tmp.push(v);
            if (tmp.length > this.#MAX_HISTORY)
                tmp.splice(0, 1);//let's not go over a reasonably small amount of local storage
            localStorage.setItem(this.#MPSC_HISTORY_ID, JSON.stringify(tmp));
        }
        else {
            this.tmpHistory.push(v);
        }
    }
    clear() {
        if (this.hasLocStorage)
            localStorage.removeItem(this.#MPSC_HISTORY_ID);
        else
            this.tmpHistory = [];
    }
    getHistory() {
        let rtn;
        if (this.hasLocStorage) {
            try {
                rtn = JSON.parse(localStorage.getItem(this.#MPSC_HISTORY_ID));
            }
            catch (ex) {
                console.log("no history data");
            }
            return rtn || [];
        }
        else
            return this.tmpHistory;
    }
    setHistory(h) {
        if (this.hasLocStorage) {
            try {
                localStorage.setItem(this.#MPSC_HISTORY_ID, JSON.stringify(h));
            }
            catch (ex) {
                console.log("no localStorage");
            }
        }
        else
            return this.tmpHistory = h.slice(0);
    }
}

    <script>
'use strict';

class MpcEA/*mobile phone style calc expression analyzer*/ {
    //the following regexp considers '4.' a valid number
    _strNumMatch(str) { return str.match(/^(-?(?:\d+\.\d*|\.\d+|\d+))/) }
    _factfn(n) {
        if (n < 0 || !Number.isInteger(n))
            throw new Error("??Illegal Factorial!");
        let prod = n || 1;
        for (let i = n - 1; i > 1; --i) prod *= i;
        return prod;
    }
    _pctfn(x) {
        if (!isFinite(x))
            throw new Error("??Illegal Percentage");
        return x * 0.01;
    }
    _getParenGroup(str) {
        //Assumes first char is '('
        //Returns entire () expression
        let idx = 0, pcount = 1;
        while (++idx < str.length) {
            const c = str[idx];
            if (c == '(')
                ++pcount;
            else if (c == ')') {
                if (--pcount == 0)
                    return str.substr(0, idx + 1);
            }
        }
        throw new Error("no closing paren found");
    }
    _getNumericLiteral(str) {
        const m = this._strNumMatch(str);
        if (m === null)
            throw new Error("unrecognized number");
        return m[1];
    }
    #CONSTN = ["e", "π"];
    //If the following list changes, please change the display function for looks for
    // things like 'only log function used' or 'only radical used'....
    #FUNCN = ["arccos", "arcsin", "arctan", "cos", "exp", "ln", "log", "sin", "tan", "⎷"];
    #PMATH = {//Pseudo math - mobile calc name to Js Math name/literal...
        "e": "2.718281828459045",
        "π": "3.141592653589793",
        "arccos": "acos",
        "arcsin": "asin",
        "arctan": "atan",
        "cos": "cos",
        "sin": "sin",
        "tan": "tan",
        "exp": "exp",
        "ln": "log",
        "log": "log10"
    };
    resolveExpr(expr, useRadians) {
        if (!expr.length) return "";
        expr = expr.replace(/--/g, '+');
        if(/\.\d+\./.test(expr))
            throw new Error("implied mult. not allowed here");
        return this._resolveExprB(expr, null, useRadians);
    }
    _resolveExprB(expr, outerFunc, useRadians) {
        const isOpStart = (s) => { return /^[-+*/\^]/.test(s) }
        let stack = [];
        let sign = expr[0] === "-" ? -1 : 1;
        let idx = sign == -1 ? 1 : 0;
        while (idx < expr.length) {
            const strsub = expr.substr(idx);

            const fnname = this.#FUNCN.filter((n) => strsub.startsWith(n))[0];
            const coname = this.#CONSTN.filter((n) => strsub.startsWith(n))[0];
            if (typeof (fnname) != "undefined") {
                if (fnname == "⎷"/*radical for square root op -- will clean this up with endgame*/)
                    stack.push("⎷"), idx += 1;//NOT resetting sign right here!!
                else {
                    let grp = this._getParenGroup(strsub.substr(fnname.length));
                    stack.push(sign * this._resolveExprB(grp.slice(1, -1), this.#PMATH[fnname], useRadians));
                    sign = 1;//resetting sign right here is okay!
                    idx += fnname.length + grp.length;
                }
            }
            else if (typeof (coname) != "undefined") {
                let cval = this.#PMATH[coname];
                stack.push(sign * cval);
                sign = 1;
                idx += coname.length;
            }
            else if (strsub[0] == '(') {
                let pgrp = this._getParenGroup(strsub);
                stack.push(sign * this._resolveExprB(pgrp.slice(1, -1), null, useRadians));
                sign = 1;
                idx += pgrp.length;
            }
            else if (strsub[0] == '-' && stack.slice(-1)[0] == '⎷')//complete kludge
            {
                sign = -1;
                idx += 1;
            }
            else if (isOpStart(strsub)) {
                stack.push(strsub[0]);
                sign = strsub[1] == '-' ? -1 : 1;
                idx += strsub[1] == '-' ? 2 : 1;
            }
            else if (strsub[0] == '!' || strsub[0] == '%' || strsub[0] == "²") {
                stack.push(strsub[0]);
                idx += 1;
            }
            else//numeric literal
            {
                const num = this._getNumericLiteral(strsub);
                stack.push(sign * num);
                sign = 1;
                idx += num.length;
            }
        }
        //resolve the highest precedent items that Js does not deal with
        for (let i = 0; i < stack.length - 1;) {
            let [si, sip1] = stack.slice(i, i + 2);
            if (/[!%²]/.test(sip1) && this._strNumMatch('' + si)) {
                stack[i] = sip1 == '!' ? this._factfn(Number(si)) :
                    sip1 == '%' ? this._pctfn(Number(si)) :
                                /*must be ²*/ Math.pow(Number(si), 2);
                stack.splice(i + 1, 1);
            }
            else
                ++i;
        }
        if (stack.slice(-1)[0] == '^') throw new Error("incomplete exponentiation");//kludge--Js eval thinks that ending '^' is ending xor and return NaN????
        for (let i = stack.length - 1; i >= 0; --i) {
            //now resolve radical, exponentiation, negatives and implicit multiplication...backwards!
            if (stack[i] == "⎷") {
                if (i == stack.length - 1 || !this._getNumericLiteral('' + stack[i + 1]))
                    throw new Error('no valid square root arg');
                stack[i] = Math.sqrt(Number(stack[i + 1]));
                if (isNaN(stack[i]))
                    throw new Error('??Negative Square Root');
                stack.splice(i + 1, 1);
                i = Math.min(i + 1, stack.length);
            }
            else if (stack[i] == '^') {
                stack[i - 1] = String(Math.pow(Number(stack[i - 1]), Number(stack[i + 1])));
                stack.splice(i, 2);
            }
            else if (isFinite(parseFloat(stack[i - 1])) && isFinite(parseFloat(stack[i])))
                stack = stack.slice(0, i).concat(['*']).concat(stack.slice(i));
        }
        let estr = stack.reduce((a, x) => a + x, "");
        //Js engine does not like '3--1'???
        let rtnnum = eval(estr.replace(/--/g, '+'));

        if (outerFunc) {
            if (!useRadians && /^(sin|cos|tan)$/.test(outerFunc))
                rtnnum *= Math.PI / 180;
            rtnnum = eval(`Math.${outerFunc}(${rtnnum})`);
            if (!useRadians && /^(asin|acos|atan)$/.test(outerFunc))
                rtnnum *= 180 / Math.PI;
        }

        return rtnnum;
    }
}

class M/*Misc*/ {
    static float2Fraction(f) {
        const sign = Math.sign(f);
        f = sign * f;
        const wholen = Math.trunc(f);
        const fracn = f - wholen;
        //only up to 6 digit denom.
        for (let i = 2; i < 1e6; ++i) {
            const r = fracn * i;
            if (Math.abs(r - Math.round(r)) < 1e-7)
                return [wholen * sign, Math.round(r), i];
        }
        return null;
    }
    static logSimplify(n) {
        for (let i = 2; i <= 53; ++i) {
            const g = n / Math.log(i);
            if (Math.round(g) == 1) continue;
            if (Math.abs(g - Math.round(g)) < 1e-10)
                return [Math.round(g), i];
        }
        return null;
    }
    static log10Simplify(n) {
        for (let i = 2; i <= 53; ++i) {
            const g = n / Math.log10(i);
            if (Math.round(g) == 1) continue;
            if (Math.abs(g - Math.round(g)) < 1e-10)
                return [Math.round(g), i];
        }
        return null;
    }
    static radSimplify(n) {
        for (let i = Math.min((n * n) | 0, 1e7/*clock easy*/); i >= 2; --i) {
            const s = Math.pow(n / i, 2);
            if (Math.abs(s - Math.round(s)) < 1e-11)
                return [i, Math.round(s)];
        }
        return null;
    }
}

<script>
    'use strict';

    var g_CD = new CalcDisplay(iddsply);
    var g_DecSep = '.';
    var g_Expr = '';
    var g_History = new History();
    var g_EA = new MpcEA();
    var g_Memory = null;
    var g_Rslt = '';

    function addParen(e) {
        const parenCt = getParenCount();
        const whichP = /[)\d\.,eπ%!²]$/.test(visualExpr().substr(0, g_CD.getSelection()[1])) && parenCt ? ')' : '(';
        if (parenCt == 0 && whichP == ')') return;
        doKeyPress(whichP);
    }
    function bkspc/*surrogate*/(evt) {
        var evt = new KeyboardEvent('keydown', { key: "Backspace" });
        g_CD.interactEvent(evt);
    }
    function buttonManager() {
        btn_invequal.disabled = !isNumericResult();
        idmc.style.cursor = g_Memory === null ? "default" : "pointer";
        idmr.style.cursor = g_Memory === null ? "default" : "pointer";
        idms.style.cursor = !isNumericResult() ? "default" : "pointer";
        idmplus.style.cursor = !isNumericResult() ? "default" : "pointer";
        idmminus.style.cursor = !isNumericResult() ? "default" : "pointer";
        btn_hist.style.visibility = idhistdiv.children.length == 0 ? "hidden" : "visible";
    }
    function calcResult(equalPressed) {
        g_Rslt = '';
        if (/^$|^-?[\.,\d]+$/.test(visualExpr()))
            return iddsplyRp.innerHTML = "";
        let expr = readyExpr4Lexing(!equalPressed), rslt;
        try {
            rslt = g_EA.resolveExpr(expr, isUseRadians()) || NaN;
            if (isNaN(rslt) && equalPressed)
                g_Rslt = "Unreal";
            else if (!isFinite(rslt) && equalPressed)
                g_Rslt = (rslt == Infinity ? "∞" : "-∞");
            else if (!isFinite(rslt))
                g_Rslt = "";
            else {
                let numRslt = toMCPrec(rslt, 12);//takes care of Locales, also
                let fancy   = fancyRsltDisplay(g_CD.degrouped(numRslt));
                g_Rslt = equalPressed ? fancy || "" : numRslt;
                if (equalPressed) {
                    updateHistory([visualExpr(), String(numRslt)]);
                    g_CD.setTemp(numRslt);
                    g_CD.setColor(getComputedStyle(iddsplyRp).color, g_CD.bgcolor, g_CD.selectcolor);
                }
            }
            iddsplyRp.innerHTML = g_Rslt;
        }
        catch (ex) {
            const exs = ex.toString();
            if (equalPressed && /\?\?/.test(exs))//incomplete
                g_Rslt = exs.replace(/\?\?|Error: /g, '');
            else if (equalPressed)
                g_Rslt = "Format Error";
            else
                g_Rslt = '';
            iddsplyRp.innerHTML = g_Rslt;
        }
    }
    function callbackSwitch(dat) {
        //dat is a 2-valued array: event(or null or "setTemp") and degrouped text
        const [evt, dtxt] = dat;
        g_CD.setColor(...getThemeColors());
        if (evt && evt.type && evt.type == "keydown") {
            if (/^\d$/.test(evt.key) || evt.key == g_DecSep)
                g_CD.addText(evt.key);
            else if (evt.key == "Enter")
                return calcResult(true);
            else if (evt && evt.type == "keydown" && /^[-+*/^]$/.test(evt.key)) {
                switch (evt.key) {
                    case '+': g_CD.addText('+'); break;
                    case '-': g_CD.addText('‒'); break;//non-ascii minus
                    case '*': g_CD.addText('×'); break;//non-ascii mult. symbol
                    case '/': g_CD.addText('÷');
                }
            }
        }
        if (evt === "setTemp")
            visualExpr(dtxt, false);
        else
            calcResult(false);
        buttonManager();
    }
    function clearHistory(evt){
        g_History.clear();
        idhistdiv.innerHTML = '';
        alert("History cleared");
        buttonManager();
    }
    function copy2Clip(evt){
        if(evt.srcElement.id == "iddsply")
            window.navigator.clipboard.writeText(visualExpr());
        else if(evt.srcElement.id == "iddsplyRp")
            window.navigator.clipboard.writeText(iddsplyRp.innerHTML);
        evt.preventDefault();
    }
    function doKeyPress(s) {
        g_CD.addText(s);
    }
    function fancyRsltDisplay(rslt) {
        const boldVariant = (int) => {
            const baseDigit = 0x0030, boldBaseDigit = 0x1d7ec;
            return String(int).split("").map((d) => {
                return String.fromCodePoint((d.codePointAt(0) - baseDigit) + boldBaseDigit);
            }).join("");
        };
        const hasRadicalOnly = (t) => /⎷/.test(t) && !/(log|ln|sin|cos|tan|exp)/.test(t);
        const hasLogOnly = (t) => /([eπ\W]|^)(log\()/.test(t) && !/⎷/.test(t) && !/(?<=[nps])\(/.test(t);
        const hasLnOnly = (t) => /([eπ\W]|^)(ln\()/.test(t) && !/⎷/.test(t) && !/(?<=[gps])\(/.test(t);
        const anyFunc = (t) => /⎷/.test(t) || /(log|ln|sin|cos|tan|exp)/.test(t);
        const nR = Number(rslt);
        if (isFinite(nR) && !Number.isInteger(nR)) {
            if (hasLogOnly(visualExpr())) {
                const logSimpl = M.log10Simplify(nR);
                if (logSimpl !== null)
                    return `${logSimpl[0]}log(${logSimpl[1]})`;
            }
            else if (hasLnOnly(visualExpr())) {
                const lnSimpl = M.logSimplify(nR);
                if (lnSimpl !== null)
                    return `${lnSimpl[0]}ln(${lnSimpl[1]})`;
            }
            else if (hasRadicalOnly(visualExpr())) {
                const radSimpl = M.radSimplify(nR);
                if (radSimpl !== null)
                    return `${radSimpl[0]}⎷${radSimpl[1]}`;
            }
            else if (!anyFunc(visualExpr())) {
                const fracArr = M.float2Fraction(Number(rslt));
                if (fracArr !== null && fracArr[1] > 0) {
                    const baseml = `~W<span style="font-size:50%;"><math style="vertical-align:8px"><mfrac><mn>~N</mn><mn>~D</mn></mfrac></math></span>`;
                    return baseml.replace('~W', fracArr[0]).replace('~N', boldVariant(fracArr[1])).replace('~D', boldVariant(fracArr[2]));
                }
            }
        }
        return null;
    }
    function getParenCount() {
        const exprArr = visualExpr().split("");
        const opens   = exprArr.filter((c) => c == '(');
        const closes  = exprArr.filter((c) => c == ')');
        return opens.length - closes.length;
    }
    function getThemeColors() {
        if (idtheme.innerHTML.startsWith("Dark"))
            return ["black", "white", "rgba(0,40,255,0.15)"];
        return ["white", "black", "rgb(64,64,64)"];
    }
    function isNumericResult() {
        //empty string also results in *false* return value
        try { return g_Rslt.length > 0 && isFinite(g_EA.resolveExpr(readyExpr4Lexing(false)), isUseRadians()) } catch (ex) { return false; }
    }
    function isPrimaryFace() { return btn_sqrt_sqr.innerHTML == "⎷" }
    function isUseRadians() { return btn_degrad.innerHTML.toLowerCase().indexOf("rad") > -1 }
    function invertFns(e) {
        const priFace = isPrimaryFace();
        btn_sqrt_sqr.innerHTML = priFace ? "x<sup>2</sup>" : "⎷";
        btn_sin_asin.innerHTML = priFace ? "sin<sup>-1</sup>" : "sin";
        btn_cos_acos.innerHTML = priFace ? "cos<sup>-1</sup>" : "cos";
        btn_tan_atan.innerHTML = priFace ? "tan<sup>-1</sup>" : "tan";
        btn_ln_exp.innerHTML   = priFace ? "e<sup>x</sup>" : "ln"
        btn_log_10Px.innerHTML = priFace ? "10<sup>x</sup>" : "log";
        buttonManager();
    }
    function loadFromHistory(evt) {
        visualExpr(evt.srcElement.innerText);
        toggleHist();
    }
    function memFunc(verb) {
        const isnumres = isNumericResult();
        switch (verb) {
            case "clear":
                g_Memory = null; break;
            case "minus":
                if (isnumres) g_Memory = (g_Memory || 0) - nonfancyResult(); break;
            case "plus":
                if (isnumres) g_Memory = (g_Memory || 0) + nonfancyResult(); break;
            case "recall":
                if (g_Memory !== null)
                    g_CD.addText(String(g_Memory));
                break;
            case "set":
                if (isnumres) g_Memory = nonfancyResult();
        }
        buttonManager();
    }
    function multiChoice(fnname) {
        const priFace = isPrimaryFace();
        switch (fnname) {
            case "⎷":
                return priFace ? "⎷" : "²";
            case "ln":
                return priFace ? "ln(" : "exp(";
            case "log":
                return priFace ? "log(" : "10^";
            case "sin":
                return priFace ? "sin(" : "arcsin(";
            case "cos":
                return priFace ? "cos(" : "arccos(";
            case "tan":
                return priFace ? "tan(" : "arctan(";
        }
    }
    function nonfancyResult(){
        //returns a numeric result or null
        let expr = readyExpr4Lexing(true), rslt;
        try {
            rslt = g_EA.resolveExpr(expr, isUseRadians()) || NaN;
        }
        catch(ex){return null}
        return isFinite(rslt) ? rslt : null;
    }
    function readyExpr4Lexing(forgiving) {
        let expr = visualExpr().replaceAll('\u00d7', '*').replaceAll('÷', '/').replaceAll('\u2012', '-');
        expr = g_CD.degrouped(expr);
        if (g_DecSep == ',') expr = expr.replaceAll(',', '.');
        if (forgiving) {
            expr = expr.replace(/[\+\-\*/\^]+$/, '');
            const pc = getParenCount();
            expr += ')'.repeat(Math.max(0, pc));
        }
        return expr;
    }

    function theme(evt) {
        let theme1 = "Light", stored = "Light";
        if(window.localStorage)
            try{stored = localStorage.getItem("MPSC_THEME")}catch(ex){;}

        if (idtheme.innerHTML.startsWith("Dark") || (!evt && stored == "Dark")) {
            document.styleSheets[1].disabled = false;
            idtheme.innerHTML = "Light Theme";
            g_CD.setColor("white", "black", "rgb(64,64,64)"), g_CD.repaint();
            theme1 = "Dark";
        }
        else if (idtheme.innerHTML.startsWith("Light") || (!evt && stored == "Light")) {
            document.styleSheets[1].disabled = true;
            idtheme.innerHTML = "Dark Theme";
            g_CD.setColor("black", "white", "rgba(0,40,255,0.15)"), g_CD.repaint();
        }

        if(window.localStorage)
            try{localStorage.setItem("MPSC_THEME", theme1)}catch(ex){;}
    }
    function toggleDegRad(evt) { btn_degrad.innerHTML = isUseRadians() ? "Deg" : "Rad"; calcResult() }
    function toggleHist(evt) {
        if (idhistdiv.className == "clsexpanded")
            idhistdiv.className = "clscollapsed"
        else if(idhistdiv.children.length)
            idhistdiv.className = "clsexpanded";
        buttonManager();
    }
    function toggleInverseRslt(evt) {
        //should only get here if isNumericResult() == true according to buttonManager()
        const [atext, btext] = ['1÷(', ')'];
        let expr = visualExpr();
        if (expr.startsWith(atext) && expr.endsWith(btext))
            visualExpr(expr.slice(atext.length, -btext.length));
        else
            visualExpr(atext + expr + btext);
        calcResult();
    }
    function toMCPrec(n, prec) {
        //assumes *n* is integral number, *prec* is number > 0
        const digitcount = (s) => s.split("").filter((x) => /\d/.test(x)).length;
        const trimZeros  = (s) => s.replace(/0+$/, '');
        const nstr = n.toLocaleString();
        if (digitcount(nstr) > prec) return n.toExponential(Math.max(0,prec-5));

        let locStr   = nstr.split(g_DecSep)[0];
        let precStrs = n.toFixed(Math.max(0,prec-locStr.length)).split(g_DecSep);
        if (precStrs.length > 1 && !Number.isInteger(n)) {
            let zTrim = trimZeros(precStrs[1]);
            return locStr + (zTrim.length ? g_DecSep + zTrim : "");
        }
        return locStr;
    }
    function updateHistory(resultPair) {
        let hist = g_History.getHistory() || [];
        if(resultPair) {
            hist = hist.filter((x)=>x[0]!=resultPair[0]);//no duplicates!
            hist.push(resultPair);
        }
        g_History.setHistory(hist);
        let innerHt = '';
        for (const v of hist)
            innerHt += `<p class="clsexpr">${v[0]}</p><p class="clsrslt">${v[1]}</p><br />`;
        idhistdiv.innerHTML = innerHt;
        const qHist = Array.from(document.querySelectorAll("p.clsexpr, p.clsrslt")).filter((x) => x.className);
        for (const p of qHist)
            p.addEventListener("click", loadFromHistory);
        idhistdiv.scroll(1000000, 1000000);
    }
    function visualExpr(txt = null, docallback = true) {
        //getter and setter for displayed expression
        if (txt === null) return g_CD.getText();
        g_CD.setText(txt, docallback);
    }

        }

        btn_bkspc.addEventListener("click", bkspc);
